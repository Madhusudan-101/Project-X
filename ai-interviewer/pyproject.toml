[project]
name = "mirracle-ai-interviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned with ~= (not >=) - an open-ended constraint here previously let
    # `uv sync` silently pull a major-version jump (langchain 0.3 -> 1.3) that
    # broke imports (langchain.text_splitter moved to a separate package).
    "langchain-chroma~=0.2.5",
    "langchain-community~=0.3.29",
    "langchain-core~=1.5.5",
    "langchain-google-genai~=4.3.4",
    "langchain-text-splitters~=1.1.2",
    "langgraph~=1.2.11",
    "livekit-agents[cartesia,deepgram,silero,turn-detector]~=1.2",
    "livekit-plugins-langchain~=1.1",
    "livekit-plugins-noise-cancellation~=0.2",
    "pypdf~=6.0.0",  # only used by ingest.py
    "python-dotenv~=1.1.1",
    "httpx>=0.27",
]

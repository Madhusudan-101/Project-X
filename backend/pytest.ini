[pytest]
# The legacy standalone scripts in tests/*.py are run with `python tests/<name>.py`
# (they sys.exit at import), so pytest is pointed only at the suites below.
testpaths = tests/unit tests/integration
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
